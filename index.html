function showLocations(){const all=DB.localisations,places=[...new Set(all.map(a=>normalLoc(a.lieu)))];const sel=state.lieu;const pool=all.filter(x=>(!sel||normalLoc(x.lieu)===sel)&&(!state.milieu||x.milieu===state.milieu));const filtered=pool.filter(x=>matches(x.pokemon,x.lieu,x.milieu,`${x.taux}%`,x.niveau));

 return pagehead('MONDE SAUVAGE','Localisations des Pokémon','Cherche un Pokémon, choisis une route, puis consulte les méthodes et taux de rencontre. Les emplacements proviennent de ton PDF français.')+`<div class="toolbar"><select id="loc" class="control"><option value="">Toutes les zones</option>${places.map(p=>`<option value="${esc(p)}" ${sel===p?'selected':''}>${esc(p)}</option>`).join('')}</select><select id="milieu" class="control"><option value="">Toutes les méthodes</option>${methods.map(p=>`<option ${state.milieu===p?'selected':''} value="${esc(p)}">${esc(p)}</option>`).join('')}</select><span class="count">${filtered.length} rencontres · ${new Set(filtered.map(a=>a.lieu)).size} zones</span></div><div class="cards">${[...grouped].map(([key,arr])=>{const a=arr[0];return `<section class="card"><div class="card-top"><h3>${esc(normalLoc(a.lieu))}</h3>${pill(a.milieu,'violet')}</div><div class="pills">${a.niveau?pill('Niveau '+a.niveau,'cyan'):''}${pill(arr.length+' rencontres')}</div><div class="stack" style="margin-top:12px">${arr.map(x=>`<div class="entry"><button class="toggle ${state.caught.has(x.pokemon)?'saved':''}" title="Marquer comme capturé" data-catch="${esc(x.pokemon)}">${state.caught.has(x.pokemon)?'✓':'○'}</button><div class="entry-text">${btnPoke(x.pokemon)}</div><span class="pill ${x.taux<=5?'gold':'cyan'}">${String(x.taux).replace('.',',')} %</span></div>`).join('')}</div>${metaPage('Localisations françaises',a.page)}</section>`}).join('')}</div>${!filtered.length?nores():''}${more(filtered.length)}${sourceFooter()}`}
function showPokedex(){let arr=DB.attaques_niveaux.rebalanced.filter(p=>matches(pname(p.en),p.en,`${p.no}`));arr.sort((a,b)=>a.no-b.no);return pagehead('POKÉDEX','Tous les Pokémon','Recherche par nom français, nom international ou numéro national. Accède aux attaques apprises, aux rencontres et aux modifications.')+`<div class="toolbar">${pill(arr.length+' Pokémon','violet')}<span class="count">Marqués comme capturés : ${state.caught.size}</span></div><div class="grid">${arr.slice(0,state.limit).map(p=>{const loc=DB.localisations.filter(x=>clean(x.pokemon)===clean(pname(p.en)));return `<article class="card"><div class="card-top"><div class="pokemon-name"><span class="pokeball">◈</span><div><div class="small">Nº ${String(p.no).padStart(3,'0')}</div><h3>${btnPoke(p.en)}</h3></div></div><button class="toggle ${state.caught.has(pname(p.en))?'saved':''}" title="Marquer comme capturé" data-catch="${esc(pname(p.en))}">${state.caught.has(pname(p.en))?'✓':'○'}</button></div><div class="pills">${pill(loc.length+' rencontres','cyan')}${DB.pokemon_modifies.some(x=>x.en===p.en)?pill('Statistiques modifiées','violet'):''}${pill(p.attaques.length+' attaques')}</div></article>`}).join('')}</div>${!arr.length?nores():''}${more(arr.length)}${sourceFooter()}`}
function showEvolutions(){let arr=DB.evolutions.filter(x=>(!x.rebalanced||['rebalanced','insanity'].includes(state.version))&&matches(pname(x.de),pname(x.vers),x.condition,x.de,x.vers));return pagehead('ÉVOLUTION','Évolutions adaptées','Les évolutions par échange deviennent possibles en solo. Certaines évolutions par niveau sont accélérées uniquement dans les versions rééquilibrées.')+`<div class="toolbar">${pill(arr.length+' adaptations','violet')}<span class="count">${versLabels[state.version]}</span></div><div class="cards">${arr.map(x=>`<article class="card"><div class="card-top"><h3>${btnPoke(x.de)}</h3>${pill(x.rebalanced?'Niveau modifié':'Méthode spéciale',x.rebalanced?'gold':'violet')}</div><div class="pills">${x.vers?`<span class="accent">↓ &nbsp; ${btnPoke(x.vers)}</span>`:''}</div><p class="desc strong" style="font-size:13px;margin-top:12px">${esc(conditionFR(x.condition))}</p>${metaPage('Évolutions',x.page)}</article>`).join('')}</div>${arr.length?'':nores()}${sourceFooter()}`}
function showItems(){let goods=DB.objets_boutique.filter(x=>matches(item(x.objet),item(x.remplace),shopPlace(x.lieu),x.objet,x.remplace));let held=DB.objets_tenus.filter(x=>matches(item(x.objet),x.details,x.objet));const ct=[['48','Ice Punch'],['60','Fire Punch'],['49','Drain Punch'],['58','Thunder Punch'],['100','Giga Drain'],['51','Sucker Punch'],['79','Freeze-Dry']];return pagehead('INVENTAIRE','Objets et CT','Emplacements modifiés, objets tenus par les Pokémon sauvages, nouvelles capacités des CT et informations sur les Méga-Gemmes.')+`<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><div class="v">${DB.objets_boutique.length}</div><div class="label">Remplacements en boutique</div></div><div class="stat"><div class="v">${DB.objets_tenus.length}</div><div class="label">Notes d’objets sauvages</div></div><div class="stat"><div class="v">7</div><div class="label">CT modifiées</div></div></div><div class="section-head"><h2>Emplacements et boutiques</h2><span class="hint">${goods.length} résultats</span></div><div class="cards">${goods.map((x,i)=>`<article class="card"><div class="card-top"><h3>${esc(item(x.objet))}</h3><button class="toggle ${state.itemchecked.has(x.lieu+'|'+x.objet)?'saved':''}" title="Objet déjà obtenu" data-itemcheck="${esc(x.lieu+'|'+x.objet)}">${state.itemchecked.has(x.lieu+'|'+x.objet)?'✓':'○'}</button></div><div class="desc">${esc(shopPlace(x.lieu))}</div><div class="pills">${pill('Remplace : '+item(x.remplace),'gold')}</div>${metaPage('Objets',x.page)}</article>`).join('')}</div>${!goods.length?nores():''}<div class="section-head"><h2>Objets portés par les Pokémon sauvages</h2><span class="hint">${held.length} notes</span></div><div class="cards">${held.map(x=>`<article class="card"><h3>${esc(item(x.objet))}</h3><p class="desc">${esc(heldFr(x))}</p>${metaPage('Objets sauvages',x.page)}</article>`).join('')}</div><div class="section-head"><h2>CT dont l’attaque a été remplacée</h2></div><div class="panel table-wrap"><table class="data-table"><thead><tr><th>CT</th><th>Nouvelle attaque</th></tr></thead><tbody>${ct.map(([n,t])=>`<tr><td class="sort">CT${n}</td><td>${esc(move(t))}</td></tr>`).join('')}</tbody></table></div><div class="notice"><b>À savoir :</b> toutes les Méga-Gemmes sauf celles de Mewtwo sont accessibles avant le Conseil 4. Les CT « Dévorêve » et « Vengeance » font exception à la disponibilité avant la Ligue. Depuis la version 2.4, la Grosseracine augmente les PV rendus de 100 % au lieu de 30 %.</div>${sourceFooter()}`}
function selectedMovesets(){return DB.attaques_niveaux[state.version.startsWith('legal')?'legal':'rebalanced']}
function showMoves(){const arr=selectedMovesets();let arrFilter=arr.filter(p=>matches(pname(p.en),p.en,p.no)||(!state.query&&true)||p.attaques.some(a=>matches(move(a[1]),a[1])));let exact=state.poke&&arrFilter.find(x=>x.en===state.poke);let chosen=exact||arrFilter[0];let matchesPoke=arrFilter.filter(x=>matches(pname(x.en),x.en,`${x.no}`));
if(state.query&&!matchesPoke.length&&arrFilter.length)matchesPoke=arrFilter;
return pagehead('ATTAQUES PAR NIVEAU','Apprentissage des attaques',`Liste complète des attaques apprises par montée de niveau dans la version ${versLabels[state.version].toLowerCase()}. Recherche un Pokémon ou une attaque.`)+`<div class="toolbar"><select id="pokemon-select" class="control" style="flex:1;min-width:220px;max-width:460px"><option value="">Choisir un Pokémon…</option>${arr.map(x=>`<option value="${esc(x.en)}" ${chosen?.en===x.en?'selected':''}>${esc(pname(x.en))} (nº ${x.no})</option>`).join('')}</select><span class="count">${arr.length} fiches</span></div>${!arrFilter.length?nores():''}${chosen?`<div class="panel"><div class="card-top"><h2>${btnPoke(chosen.en)}</h2>${pill(chosen.attaques.length+' attaques','cyan')}</div><p class="small">Les niveaux marqués 1 correspondent aux attaques disponibles dès le premier niveau ou via le Maître des Capacités selon le fonctionnement du jeu.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Niveau</th><th>Attaque apprise</th></tr></thead><tbody>${chosen.attaques.map(a=>`<tr><td class="sort">${a[0]}</td><td>${esc(move(a[1]))}</td></tr>`).join('')}</tbody></table></div></div>`:''}${arrFilter.length>1&&state.query?`<div class="section-head"><h2>Autres Pokémon correspondants</h2><span class="hint">${arrFilter.length} résultats</span></div><div class="cards">${arrFilter.slice(0,40).map(p=>`<article class="card"><div class="card-top"><h3>${btnPoke(p.en)}</h3><button class="btn" data-moves="${esc(p.en)}">Voir les attaques</button></div><p class="desc">${p.attaques.filter(a=>matches(move(a[1]),a[1])).slice(0,3).map(a=>`Niv. ${a[0]} : ${esc(move(a[1]))}`).join(' · ')||p.attaques.length+' attaques'}</p></article>`).join('')}</div>`:''}${sourceFooter()}`}
function typeFR(str){return String(str).replace(/=\s*>|=>/g,' → ').replace(/\b(Normal|Fire|Water|Electric|Grass|Ice|Fighting|Poison|Ground|Flying|Psychic|Bug|Rock|Ghost|Dragon|Dark|Steel|Fairy)\b/g,a=>({'Fire':'Feu','Water':'Eau','Electric':'Électrik','Grass':'Plante','Ice':'Glace','Fighting':'Combat','Ground':'Sol','Flying':'Vol','Psychic':'Psy','Bug':'Insecte','Rock':'Roche','Ghost':'Spectre','Dark':'Ténèbres','Steel':'Acier','Fairy':'Fée'}[a]||a))};
function showChanges(){if(state.version==='legal'||state.version==='legal-insanity')return pagehead('ÉQUILIBRAGE','Modifications des Pokémon','Ces modifications ne concernent pas la version légale.')+`<div class="notice">La version <b>légale</b> ne reprend pas les modifications de statistiques et de types exclusives aux versions rééquilibrées. Change la version dans le menu supérieur pour les consulter.</div>`+sourceFooter();
let changes=DB.pokemon_modifies.filter(p=>matches(pname(p.en),p.en,p.newMoves,p.abilities,p.types));return pagehead('ÉQUILIBRAGE','Pokémon modifiés','Les nouveaux scores de statistiques, talents, types et attaques du mode rééquilibré. Une statistique absente du tableau signifie qu’elle n’a pas été modifiée ou n’était pas renseignée.')+`<div class="toolbar">${pill(changes.length+' fiches','violet')}</div><div class="cards">${changes.slice(0,state.limit).map(p=>`<article class="card"><div class="card-top"><h3>${btnPoke(p.en)}</h3>${pill('Rééquilibrage','violet')}</div>${Object.keys(p.stats.original).length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Statistique</th><th>Avant</th><th>Après</th></tr></thead><tbody>${Object.keys(p.stats.original).map(k=>`<tr><td>${esc(k)}</td><td>${p.stats.original[k]}</td><td class="accent strong">${p.stats.modified[k]??'—'}</td></tr>`).join('')}</tbody></table></div>`:''}${p.newMoves?`<p class="desc"><strong>Nouvelles attaques :</strong> ${esc(p.newMoves.split(/, /).map(t=>{let m=t.match(/^(TM|HM)\d+\s+(.+)$/);return move(m?m[2]:t)}).join(' · '))}</p>`:''}${p.abilities?`<p class="desc"><strong>Talents :</strong> ${esc(abi(p.abilities))}</p>`:''}${p.types?`<p class="desc"><strong>Type :</strong> ${esc(typeFR(p.types))}</p>`:''}${metaPage('Pokémon modifiés',p.page)}</article>`).join('')}</div>${!changes.length?nores():''}${more(changes.length)}${sourceFooter()}`}
function showMoveChanges(){if(state.version==='legal'||state.version==='legal-insanity')return pagehead('ATTAQUES MODIFIÉES','Changements des attaques','Ces changements de puissance, précision et PP concernent uniquement la version rééquilibrée.')+`<div class="notice">Les modifications de capacités ci-dessous sont exclusives à la version <b>rééquilibrée</b>. Sélectionne une version rééquilibrée pour les consulter.</div>`+sourceFooter();let m=DB.attaques_modifiees.filter(x=>matches(move(x.attaque),x.attaque,moveDetail(x)));return pagehead('MÉCANIQUES','Attaques modifiées','Modifications des puissances, précisions, PP et effets. Les changements additionnels issus de Soleil et Lune sont appliqués mais non tous énumérés dans le PDF.')+`<div class="toolbar">${pill(m.length+' modifications','violet')}</div><div class="cards">${m.map(x=>`<article class="card"><div class="card-top"><h3>${esc(move(x.attaque))}</h3>${pill('Attaque adaptée','cyan')}</div><p class="desc strong" style="font-size:13px">${esc(moveDetail(x))}</p>${metaPage('Attaques modifiées',x.page)}</article>`).join('')}</div>${m.length?'':nores()}${sourceFooter()}`}
function showTrainers(){const list=DB.dresseurs[state.version]||DB.dresseurs.rebalanced;const select=list.filter(x=>matches(trainerName(x.en),x.en,...x.pokemon.map(m=>pname(m.en)),...x.pokemon.map(m=>m.attaques.map(move).join(' '))));return pagehead('COMBATS','Équipes des dresseurs','Les Pokémon, attaques, niveaux, talents, objets et IV des principaux adversaires. Équipes sélectionnées selon la variante du hack.')+`<div class="toolbar">${pill(versLabels[state.version],'violet')}<span class="count">${select.length} combats · ${list.length} fiches disponibles</span></div><div class="stack">${select.slice(0,state.limit).map((x,i)=>`<article class="panel"><div class="card-top"><h3 style="font-size:19px">${esc(trainerName(x))}${x.en==='Lysandre Labs'?' — Combat documenté p. '+x.page:''}</h3>${pill(x.pokemon.length+' Pokémon','violet')}</div><div class="grid" style="margin-top:16px">${x.pokemon.map(m=>`<div class="card" style="background:#10192b;padding:15px"><div class="card-top"><h3>${btnPoke(m.en)}</h3>${pill('Niv. '+(m.niveau||'?'),'cyan')}</div><div class="pills">${pill('Talent : '+abi(m.talent))}${m.objet?pill('Objet : '+item(m.objet),'gold'):''}${m.ivs?pill('IV : '+m.ivs):''}</div><div class="stack" style="margin-top:12px">${m.attaques.map(a=>`<div class="small">• ${esc(move(a))}</div>`).join('')}</div></div>`).join('')}</div>${metaPage('Équipes des dresseurs',x.page)}</article>`).join('')}</div>${!select.length?nores():''}${more(select.length)}${sourceFooter()}`}
function showGlobal(){if(!state.query)return pagehead('RECHERCHE GLOBALE','Recherche dans tout le guide','Écris un Pokémon, une route, un objet ou une attaque pour retrouver les résultats dans toutes les catégories.')+`<div class="empty"><span class="big">⌕</span>Exemples : <button class="linkish" data-lookup="Pikachu">Pikachu</button> · <button class="linkish" data-lookup="Orbe Vie">Orbe Vie</button> · <button class="linkish" data-lookup="Route 5">Route 5</button> · <button class="linkish" data-lookup="Poing Glace">Poing Glace</button></div>`;
const pks=DB.attaques_niveaux.rebalanced.filter(x=>matches(pname(x.en),x.en,`${x.no}`)).slice(0,18);
const loc=DB.localisations.filter(x=>matches(x.pokemon,x.lieu,x.milieu,x.niveau)).slice(0,18);
const evo=DB.evolutions.filter(x=>matches(pname(x.de),pname(x.vers),conditionFR(x.condition))).slice(0,10);
const itm=DB.objets_boutique.filter(x=>matches(item(x.objet),shopPlace(x.lieu),x.objet,x.remplace)).slice(0,12);
const mos=DB.attaques_modifiees.filter(x=>matches(move(x.attaque),x.attaque)).slice(0,10);
const lvl=selectedMovesets().filter(x=>x.attaques.some(a=>matches(move(a[1]),a[1]))).slice(0,14);
const sections=[['pokemon','Pokémon',pks.map(x=>btnPoke(x.en))],['localisations','Localisations',loc.map(x=>`${btnPoke(x.pokemon)} — ${esc(normalLoc(x.lieu))} · ${x.taux} %`)],['objets','Objets',itm.map(x=>`${esc(item(x.objet))} — ${esc(shopPlace(x.lieu))}`)],['evolutions','Évolutions',evo.map(x=>`${esc(pname(x.de))}${x.vers?' → '+esc(pname(x.vers)):' — niveau adapté'}`)],['attaques','Apprentissage d’attaques',lvl.map(x=>`${btnPoke(x.en)} — ${x.attaques.filter(a=>matches(move(a[1]),a[1])).slice(0,1).map(a=>'Niv. '+a[0]+' · '+esc(move(a[1]))).join('')}`)],['capacites','Attaques modifiées',mos.map(x=>esc(move(x.attaque)))]];
return pagehead('RECHERCHE','Résultats pour « '+state.query+' »','Résultats regroupés par rubrique. Sélectionne un résultat pour afficher sa fiche.')+sections.filter(x=>x[2].length).map(([key,title,items])=>`<section class="panel" style="margin-bottom:15px"><div class="card-top"><h3>${esc(title)}</h3><button class="btn" data-tab="${key}">Voir tout ↗</button></div><div class="pills">${items.map(t=>`<span class="pill" style="padding:9px 12px">${t}</span>`).join('')}</div></section>`).join('')+(!sections.some(x=>x[2].length)?nores():'')+sourceFooter();}
function showGuide(){return pagehead('DOCUMENTATION','Informations importantes','À propos des données et de leurs limites, des variantes du hack et des fonctionnalités disponibles.')+`<div class="stack"><div class="panel"><h3>📚 Données intégrées</h3><p class="desc" style="margin-top:10px">Ce guide réunit les documents transmis : localisations françaises et anglaises, évolutions, emplacements d’objets, attaques par niveau (versions légale et rééquilibrée), changements de Pokémon, changements d’attaques et quatre listes de dresseurs.</p></div><div class="panel"><h3>🎮 Quelle version choisir ?</h3><div class="itemlist" style="margin-top:12px"><div class="item-row"><b>Rééquilibrée (normale)</b><span class="small">Statistiques et talents modifiés, attaques rééquilibrées, équipes de dresseurs standard.</span></div><div class="item-row"><b>Légale</b><span class="small">Listes d’attaques adaptées à la variante légale, équipes légales sans rééquilibrage des statistiques.</span></div><div class="item-row"><b>Difficile</b><span class="small">Rééquilibrages actifs et équipes « Insanity » de la source.</span></div><div class="item-row"><b>Légale + difficile</b><span class="small">Attaques de la variante légale et équipes « Legal Insanity ».</span></div></div></div><div class="panel"><h3>⚠️ Particularités à connaître</h3><div class="itemlist" style="margin-top:12px"><p class="small">• Dans la variante « Online », les rencontres sauvages redeviennent celles de Pokémon X/Y. Ce guide de rencontres s’applique aux autres versions documentées et ne prétend pas couvrir les exceptions non modifiables (poubelles, plafonds, etc.).</p><p class="small">• Le PDF des localisations contient au moins une entrée mal formée : Route 3, Super Canne, « Poissirène (35) », sans symbole %. L’application n’invente pas le taux manquant et le signale.</p><p class="small">• Les « attaques au niveau 1 » reprennent la liste documentaire. Il n’est pas toujours possible de les apprendre toutes immédiatement en jeu.</p><p class="small">• Les documents de dresseurs n’incluent pas les rematchs du Château de Combat ni toutes les équipes de l’après-jeu.</p><p class="small">• Les listes rééquilibrées présentent certaines modifications issues de Soleil et Lune sans exhaustivité dans leurs tableaux de différences.</p></div></div><div class="panel"><h3>🇫🇷 Traductions officielles</h3><p class="desc" style="margin-top:10px">Les localisations reprennent le PDF français transmis. Les autres noms sont rapprochés des dictionnaires anglais-français Pokémon ; un dictionnaire embarqué est disponible sans Internet. Lorsque la connexion est disponible, l’application récupère les correspondances françaises de la base ouverte veekun et les conserve localement. Si une traduction manque, elle n’affiche pas volontairement une traduction anglaise à la place.</p><div class="pills">${pill(state.online?'Dictionnaire complémentaire chargé':'Dictionnaire intégré actif',state.online?'green':'gold')}</div></div><div class="panel"><h3>✅ Suivi personnel</h3><p class="desc">Les boutons ○ / ✓ servent à marquer les Pokémon capturés et les objets récupérés. Ils sont enregistrés dans ce navigateur. Aucune connexion ou compte n’est nécessaire.</p></div></div>${sourceFooter()}`}
function sourceFooter(){return `<footer class="footer-note">Wilting Y Explorer · Réalisé à partir des documents fournis · Aucune donnée de localisation ou d’équipe n’a été remplacée par celles du jeu Pokémon Y standard. Pokémon appartient à ses titulaires de droits respectifs.</footer>`}
function nores(){return `<div class="empty"><span class="big">☁</span>Aucun résultat avec ces filtres. Essaie un nom plus court ou réinitialise la recherche.</div>`}
function more(len){return len>state.limit?`<div class="load-more"><button class="btn" data-more="1">Afficher davantage (${len-state.limit} résultats restants)</button></div>`:''}
function render(){const root=$('#root');let tab=state.tab;let h=({accueil:showHome,recherche:showGlobal,pokemon:showPokedex,localisations:showLocations,objets:showItems,evolutions:showEvolutions,attaques:showMoves,modifs:showChanges,capacites:showMoveChanges,dresseurs:showTrainers,guide:showGuide}[tab]||showHome)();root.innerHTML=h;$('#variant').value=state.version}
function openPokemon(en){const name=pname(en);const entries=DB.localisations.filter(x=>clean(x.pokemon)===clean(name));let lvl=selectedMovesets().find(x=>x.en===en||pname(x.en)===name);let mod=DB.pokemon_modifies.find(x=>x.en===en);let evo=DB.evolutions.filter(x=>pname(x.de)===name||pname(x.vers)===name);const sel=$('#modal-container');sel.innerHTML=`<div class="modal-wrap" data-overlay="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Fiche Pokémon"><button class="close" data-close="1" aria-label="Fermer">×</button><div class="eyebrow">POKÉDEX DU HACK</div><h2>${esc(name)}</h2><div class="sub">${lvl?'Pokémon nº '+String(lvl.no).padStart(3,'0'):'Fiche Pokémon'} · ${versLabels[state.version]}</div><div class="pills">${pill(entries.length+' rencontres','cyan')}${pill((lvl?.attaques.length||0)+' attaques','violet')}${mod?pill('Rééquilibré','gold'):''}</div>${entries.length?`<h3>⌖ Où le trouver ?</h3><div class="stack">${entries.map(x=>`<div class="item-row"><span class="strong">${esc(normalLoc(x.lieu))}</span>${pill(x.milieu)}${pill((x.niveau?'Niv. '+x.niveau+' · ':'')+x.taux+' %','cyan')}</div>`).join('')}</div>`:'<h3>⌖ Localisations</h3><p class="small">Aucune rencontre listée dans le document.</p>'}${evo.length?`<h3>↗ Évolutions adaptées</h3>${evo.map(x=>`<div class="item-row"><span>${esc(pname(x.de))} → ${esc(pname(x.vers)||'niveau adapté')}</span><span class="small">${esc(conditionFR(x.condition))}</span></div>`).join('')}`:''}${lvl?`<h3>✦ Attaques par niveau</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Niveau</th><th>Attaque</th></tr></thead><tbody>${lvl.attaques.map(a=>`<tr><td class="sort">${a[0]}</td><td>${esc(move(a[1]))}</td></tr>`).join('')}</tbody></table></div>`:''}${mod&&['rebalanced','insanity'].includes(state.version)?`<h3>⚙ Rééquilibrage</h3>${Object.keys(mod.stats.original).map(k=>`<p class="small">${esc(k)} : ${mod.stats.original[k]} → ${mod.stats.modified[k]}</p>`).join('')}${mod.newMoves?`<p class="small">Nouvelles attaques : ${esc(mod.newMoves.split(', ').map(move).join(' · '))}</p>`:''}`:''}<div class="divider"></div><button class="btn" data-close="1">Fermer</button></div></div>`;sel.querySelector('.close')?.focus();}
function attach(){
 $('#nav').addEventListener('click',e=>{let x=e.target.closest('[data-tab]');if(x)searchHit(x.dataset.tab)});
 $('#root').addEventListener('click',e=>{let a=e.target.closest('[data-tab],[data-poke],[data-catch],[data-moves],[data-itemcheck],[data-lookup],[data-more]');if(!a)return;if(a.hasAttribute('data-tab')){searchHit(a.dataset.tab)}else if(a.hasAttribute('data-poke')){openPokemon(a.dataset.poke)}else if(a.hasAttribute('data-catch')){let v=a.dataset.catch;state.caught.has(v)?state.caught.delete(v):state.caught.add(v);store();render()}else if(a.hasAttribute('data-itemcheck')){let v=a.dataset.itemcheck;state.itemchecked.has(v)?state.itemchecked.delete(v):state.itemchecked.add(v);store();render()}else if(a.hasAttribute('data-moves')){state.poke=a.dataset.moves;state.tab='attaques';updateNav();render();window.scrollTo({top:0,behavior:'smooth'})}else if(a.hasAttribute('data-more')){state.limit+=72;render()}else if(a.hasAttribute('data-lookup')){setQuery(a.dataset.lookup)}});
 $('#root').addEventListener('change',e=>{if(e.target.id==='loc'){state.lieu=e.target.value;state.milieu='';state.limit=72;render()}else if(e.target.id==='milieu'){state.milieu=e.target.value;state.limit=72;render()}else if(e.target.id==='pokemon-select'){state.poke=e.target.value;render()}});
 $('#variant').addEventListener('change',e=>{state.version=e.target.value;state.poke='';store();render()});
 $('#search').addEventListener('input',e=>{state.query=e.target.value;state.limit=72;if(state.tab==='accueil')state.tab='recherche';updateNav();render()});
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();$('#search').select()}if(e.key==='Escape'){$('#modal-container').innerHTML=''}});
 $('#modal-container').addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target.hasAttribute('data-overlay'))$('#modal-container').innerHTML='';else if(e.target.closest('[data-poke]'))openPokemon(e.target.closest('[data-poke]').dataset.poke)});
}
async function onlineDictionary(){const base='https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/';let cache=LS('wy-official-fr',null);if(cache&&cache.pokemon&&cache.moves&&cache.items&&cache.abilities){state.remote=cache;state.online=true;$('#status-small').textContent='Dictionnaire français complété.';render();return}
 try{const specs=[['pokemon','pokemon_species_names.csv'],['moves','move_names.csv'],['items','item_names.csv'],['abilities','ability_names.csv']];const maps={};for(const [type,file] of specs){const ctl=new AbortController();let timer=setTimeout(()=>ctl.abort(),9000);let res=await fetch(base+file,{signal:ctl.signal});clearTimeout(timer);if(!res.ok)throw Error('Ressource distante indisponible');let raw=await res.text();let rows=raw.split(/\r?\n/);let byId={};let out={};for(let row of rows.slice(1)){let f=row.match(/^([^,]+),([^,]+),("(?:[^"]|"")*"|[^,]*)/);if(!f)continue;let id=f[1],language=f[2],name=f[3].replace(/^"|"$/g,'').replace(/""/g,'"');if(!byId[id])byId[id]={};if(language==='5')byId[id].fr=name;if(language==='9')byId[id].en=name}
 for(const v of Object.values(byId))if(v.en&&v.fr)out[v.en.toLowerCase()]=v.fr;maps[type]=out;}
 state.remote=maps;state.online=true;try{localStorage.setItem('wy-official-fr',JSON.stringify(maps))}catch{}$('#status-small').textContent='Dictionnaire français complété.';render();
 }catch(err){state.online=false;$('#status-small').textContent='Dictionnaire local (hors ligne).';}
}
updateNav();attach();render();onlineDictionary();
</script></body></html>
